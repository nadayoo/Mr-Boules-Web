<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Boules — Mathematics — Oct/Nov 2026 Session</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="grid-texture"></div>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-eyebrow">Mathematics — Oct/Nov 2026 Session</div>
    <h1 class="login-title">Mr. Boules</h1>
    <p class="login-subtitle">Sign in to access your lectures, homework, and notes.</p>
    <div class="login-card">
      <label class="login-label">Email</label>
      <input class="login-input" type="email" id="login-email" placeholder="your@email.com" autocomplete="email" />
      <label class="login-label">Student ID <span class="opt">— this is your password</span></label>
      <input class="login-input" type="password" id="login-id" placeholder="e.g. A0A56" maxlength="20" style="text-transform:uppercase" autocomplete="current-password" />
      <div class="login-error" id="login-error"></div>
      <button class="login-btn" id="login-btn" onclick="doLogin()"><i class="ti ti-arrow-right"></i> Sign in</button>
      <div class="login-footer">
        <p>Didn't receive your ID, or think it's wrong?<br><strong>Contact the assistants</strong> — don't try to guess it.</p>
      </div>
    </div>
    <div class="session-tag"><i class="ti ti-calendar-event"></i> Oct/Nov 2026 Examination Session</div>
  </div>
</div>

<div id="hub-screen">
  <div class="page" id="page">
    <div class="hub-header">
      <div>
        <div class="hub-eyebrow">Mathematics — Oct/Nov 2026 Session</div>
        <h1 class="hub-title">Mr. Boules</h1>
        <div class="hub-meta" id="user-email-display"></div>
      </div>
      <div class="header-right">
        <span class="role-badge" id="role-badge"></span>
        <button class="logout-btn" onclick="doLogout()"><i class="ti ti-logout"></i> Sign out</button>
      </div>
    </div>
    <div class="admin-tools" id="admin-tools" style="display: none;">
      <button onclick="window.location.href='import-students.html'"><i class="ti ti-upload"></i> Import Students</button>
    </div>
    <div class="subject-tabs" id="subject-tabs"></div>
    <div id="subject-panels"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/auth.js"></script>
<script type="module">
  import { doLogin } from './js/auth.js';
  import './js/marks.js';
  document.getElementById('login-email').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('login-id').focus(); });
  document.getElementById('login-id').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
</script>
</body>
</html>
